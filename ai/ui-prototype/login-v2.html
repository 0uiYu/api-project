<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440" />
  <title>Sign in · Project X</title>
  <link rel="stylesheet" href="prototype.css" />
  <link rel="stylesheet" href="prototype-v2.css" />
</head>
<body class="design">
  <div class="login">
    <section class="login-brand v2-login-brand">
      <div class="v2-login-inner">
        <div class="v2-login-copy">
          <svg class="mark" viewBox="0 0 22 22" aria-hidden="true">
            <rect x="1.25" y="1.25" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="7.75" y="7.75" width="13" height="13" rx="3"/>
          </svg>
          <h1>Project X</h1>
          <p>One key for the models you run.</p>
        </div>
        <div class="v2-api" aria-hidden="true">
          <div class="v2-api-method"><span class="verb">POST</span><span class="path">/v1/chat/completions</span></div>
          <div class="v2-api-line"><span class="k">model</span><span class="v">claude-sonnet-4-5</span></div>
          <div class="v2-api-line"><span class="k">group</span><span class="v">default</span></div>
        </div>
      </div>
    </section>

    <main class="login-main">
      <form class="login-form" action="#" method="post">
        <div class="form-brand">
          <svg class="mark" viewBox="0 0 22 22" aria-hidden="true">
            <rect x="1.25" y="1.25" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="7.75" y="7.75" width="13" height="13" rx="3"/>
          </svg>
          Project X
        </div>

        <h2>Sign in</h2>
        <p class="subline">Don't have an account? <a class="link" href="#">Sign up</a></p>

        <div class="auth-fields">
          <div>
            <div class="auth-label-row">
              <label class="auth-label" for="username">Username or Email</label>
            </div>
            <div class="auth-field is-focus">
              <input id="username" name="username" type="text" placeholder="Enter your username or email" autocomplete="username" />
            </div>
          </div>
          <div>
            <div class="auth-label-row">
              <label class="auth-label" for="password">Password</label>
              <a class="link" href="#" style="font-size:13px;">Forgot password?</a>
            </div>
            <div class="auth-field">
              <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" />
              <button class="eye" type="button" aria-label="Show password">
                <svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Sign in</button>

        <div class="or">or</div>

        <div class="oauth">
          <button class="btn btn-secondary" type="button">
            <svg class="ico" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            Continue with GitHub
          </button>
          <button class="btn btn-secondary" type="button">
            <svg class="ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.1.1 0 0 0-.1.05c-.18.33-.39.76-.53 1.09a16.1 16.1 0 0 0-4.74 0c-.14-.34-.35-.76-.54-1.09a.1.1 0 0 0-.1-.05c-1.5.26-2.93.71-4.27 1.33a.1.1 0 0 0-.05.04C2.2 9.05 1.5 12.67 1.84 16.25c0 .04.02.07.05.07 1.8 1.32 3.53 2.12 5.24 2.65.04 0 .08-.02.1-.05.4-.55.76-1.13 1.07-1.74.02-.04 0-.08-.04-.09-.57-.22-1.11-.48-1.64-.78-.04-.02-.04-.08-.01-.11.11-.08.22-.17.33-.25.02-.02.05-.02.07-.01 3.44 1.57 7.15 1.57 10.55 0 .02-.01.05-.01.07.01.11.09.22.17.33.26.04.03.04.09-.01.11-.52.31-1.07.56-1.64.78-.04.01-.05.06-.04.09.32.61.68 1.19 1.07 1.74.03.03.07.05.1.05 1.72-.53 3.45-1.33 5.25-2.65.02-.02.03-.05.02-.07.41-4.22-.68-7.8-2.88-11.02a.08.08 0 0 0-.04-.03zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"/></svg>
            Continue with Discord
          </button>
          <button class="btn btn-secondary" type="button">
            <svg class="ico" viewBox="0 0 24 24"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>
            Sign in with Passkey
          </button>
        </div>

        <p class="terms">By clicking sign in, you agree to our<br /><a href="#">User Agreement</a> and <a href="#">Privacy Policy</a>.</p>
      </form>
    </main>
  </div>
</body>
</html>
