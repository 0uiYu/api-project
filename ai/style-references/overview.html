<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Sable · 概览</title>
  <link rel="stylesheet" href="sable.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="mark">S</div>
      <button class="nav-btn active" aria-label="概览">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 13.5 6.2 8.8 9.1 11.2 16 4" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="nav-btn" aria-label="密钥">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="6" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 9h8M13.5 9v2.2M16 9v1.6" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="nav-btn" aria-label="模型">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5.5h12M3 9h12M3 12.5h8" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="nav-btn" aria-label="试用">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="3.5" width="13" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M5 8.2 7 10.2 5 12.2M8.5 12.2H12" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="nav-btn" aria-label="用量">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 14V8M9 14V4M14 14v-3" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="nav-btn" aria-label="钱包">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="4.5" width="13" height="9" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7.5h13" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="nav-btn" aria-label="账户">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="7" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M4.2 14.2c.8-2 2.5-3 4.8-3s4 1 4.8 3" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </aside>
    <main class="stage">
      <header class="top">
        <div>
          <p class="kicker">Console</p>
          <h1>概览</h1>
          <p class="sub">今天 128 次请求，1 次失败。</p>
        </div>
        <div class="balance">
          <span>余额</span>
          <strong>$48.20</strong>
        </div>
      </header>
      <section class="chart">
        <div class="chart-head"><span>最近 14 天的请求</span><span class="mono">10/01 — 10/14</span></div>
        <svg viewBox="0 0 1296 220" preserveAspectRatio="none">
          <path d="M0 170 L100 160 L200 150 L300 158 L400 120 L500 132 L600 90 L700 104 L800 70 L900 86 L1000 48 L1100 62 L1200 36 L1296 42 L1296 220 L0 220 Z" fill="#e6a317" opacity="0.14"/>
          <path d="M0 170 L100 160 L200 150 L300 158 L400 120 L500 132 L600 90 L700 104 L800 70 L900 86 L1000 48 L1100 62 L1200 36 L1296 42" fill="none" stroke="#e6a317" stroke-width="1.6"/>
        </svg>
      </section>
      <div class="section-head"><span>最近请求</span><span>查看用量</span></div>
      <div class="table-head"><span>时间</span><span>模型</span><span>密钥</span><span>状态</span><span>延迟</span></div>
      <div class="row"><span class="mono faint">10:21:08</span><span class="mono">claude-sonnet-4-5</span><span class="mono muted">prod-web</span><span class="ok">成功</span><span class="mono">412 ms</span></div>
      <div class="row"><span class="mono faint">10:18:44</span><span class="mono">gpt-4.1</span><span class="mono muted">prod-web</span><span class="ok">成功</span><span class="mono">268 ms</span></div>
      <div class="row"><span class="mono faint">10:11:02</span><span class="mono">gemini-2.5-pro</span><span class="mono muted">batch</span><span class="ok">成功</span><span class="mono">640 ms</span></div>
      <div class="row"><span class="mono faint">09:58:17</span><span class="mono">claude-opus-4-1</span><span class="mono muted">studio</span><span style="color:#d36b5f">失败</span><span class="mono">—</span></div>
      <div class="row"><span class="mono faint">09:41:55</span><span class="mono">gpt-4.1-mini</span><span class="mono muted">prod-web</span><span class="ok">成功</span><span class="mono">190 ms</span></div>
    </main>
  </div>
</body>
</html>
