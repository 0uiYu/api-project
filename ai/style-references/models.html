<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Sable · 模型</title>
  <link rel="stylesheet" href="sable.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="mark">S</div>
      <button class="nav-btn" aria-label="概览"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 13.5 6.2 8.8 9.1 11.2 16 4" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="nav-btn" aria-label="密钥"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="6" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 9h8M13.5 9v2.2M16 9v1.6" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="nav-btn active" aria-label="模型"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5.5h12M3 9h12M3 12.5h8" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="nav-btn" aria-label="试用"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="3.5" width="13" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M5 8.2 7 10.2 5 12.2M8.5 12.2H12" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="nav-btn" aria-label="用量"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 14V8M9 14V4M14 14v-3" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button class="nav-btn" aria-label="钱包"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="4.5" width="13" height="9" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7.5h13" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <div class="rail-spacer"></div>
      <button class="nav-btn" aria-label="账户"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="7" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M4.2 14.2c.8-2 2.5-3 4.8-3s4 1 4.8 3" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </aside>
    <main class="stage models">
      <header class="top">
        <div>
          <p class="kicker">Catalog</p>
          <h1>模型</h1>
          <p class="sub">价格按每百万 token。调用名用左边这一列。</p>
        </div>
        <button class="ghost">分组 default</button>
      </header>
      <div class="table-head"><span>模型</span><span>厂商</span><span>输入</span><span>输出</span><span>状态</span></div>
      <div class="row"><span class="mono">claude-sonnet-4-5</span><span>Anthropic</span><span class="mono">$3.00</span><span class="mono">$15.00</span><span class="ok">可用</span></div>
      <div class="row"><span class="mono">claude-opus-4-1</span><span>Anthropic</span><span class="mono">$15.00</span><span class="mono">$75.00</span><span class="ok">可用</span></div>
      <div class="row"><span class="mono">gpt-4.1</span><span>OpenAI</span><span class="mono">$2.00</span><span class="mono">$8.00</span><span class="ok">可用</span></div>
      <div class="row"><span class="mono">gpt-4.1-mini</span><span>OpenAI</span><span class="mono">$0.40</span><span class="mono">$1.60</span><span class="ok">可用</span></div>
      <div class="row"><span class="mono">gemini-2.5-pro</span><span>Google</span><span class="mono">$1.25</span><span class="mono">$10.00</span><span class="ok">可用</span></div>
      <div class="row"><span class="mono">deepseek-v3</span><span>DeepSeek</span><span class="mono">$0.27</span><span class="mono">$1.10</span><span class="faint">维护</span></div>
    </main>
  </div>
</body>
</html>
